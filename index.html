<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B3A34" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Mis Finanzas</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFF3F0; font-family: sans-serif; }
  #root { min-height: 100vh; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;


const MESES = [
  "Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
];
const CATEGORIAS = ["Vivienda", "Servicios", "Alimentación", "Transporte", "Salud", "Entretenimiento", "Educación", "Otros"];

function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}
function monthLabel(date) {
  return `${MESES[date.getMonth()]} ${date.getFullYear()}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtGs(n) {
  const v = Number(n) || 0;
  return "₲ " + v.toLocaleString("es-PY", { maximumFractionDigits: 0 });
}
function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const LOCAL_KEY = "finanzas-app-data-v2";

// Convierte datos guardados con la estructura vieja (tarjeta/cuenta, ingresos fijos, "loans")
// a la estructura nueva, para no perder nada de lo que ya cargaste.
function migrateData(raw) {
  if (!raw) return null;
  const isOld = !!raw.config || !!raw.loans;
  if (!isOld) return raw;

  const out = { fixedExpenses: [], variableExpenses: [], variableIncome: [], dailyEntries: raw.dailyEntries || [], monthlyStatus: {} };
  const oldConfig = raw.config || { fixedExpenses: [], fixedIncome: [] };
  const oldStatus = raw.monthlyStatus || {};

  out.fixedExpenses = (oldConfig.fixedExpenses || []).map((i) => ({ id: i.id, name: i.name, amount: i.amount, category: "" }));

  Object.keys(oldStatus).forEach((m) => {
    out.monthlyStatus[m] = { expensesPaid: oldStatus[m].expensesPaid || [] };
  });

  (oldConfig.fixedIncome || []).forEach((inc) => {
    const installments = {};
    const months = new Set(Object.keys(oldStatus));
    months.add(monthKey(new Date()));
    months.forEach((m) => {
      const paid = (oldStatus[m] && oldStatus[m].incomePaid || []).includes(inc.id);
      installments[m] = { amount: inc.amount, paid };
    });
    out.variableIncome.push({ id: inc.id, name: inc.name, installments });
  });

  (raw.loans || []).forEach((l) => {
    out.variableExpenses.push({ id: l.id, name: l.name, category: "", installments: l.installments || {} });
  });

  return out;
}

function FinanzasTracker() {
  const [variableExpenses, setVariableExpenses] = useState([]);
  const [variableIncome, setVariableIncome] = useState([]);
  const [dailyEntries, setDailyEntries] = useState([]);
  const [selectedDate, setSelectedDate] = useState(new Date());
  const [tab, setTab] = useState("diario");
  const [dirty, setDirty] = useState(false);
  const [showWelcome, setShowWelcome] = useState(true);
  const [welcomeMsg, setWelcomeMsg] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [autoSaved, setAutoSaved] = useState(false);

  function loadFromData(rawData) {
    const data = migrateData(rawData) || {};
    let ve = data.variableExpenses || [];
    // La pestaña "Fijos" de monto siempre igual ya no existe: lo que hubiera ahí
    // se convierte en un gasto fijo con cronograma, con el mes actual ya cargado.
    const oldFixed = data.fixedExpenses || [];
    if (oldFixed.length > 0) {
      const nowKey = monthKey(new Date());
      const existingIds = new Set(ve.map((v) => v.id));
      oldFixed.forEach((fe) => {
        if (existingIds.has(fe.id)) return;
        ve = [...ve, { id: fe.id, name: fe.name, category: fe.category || "", installments: { [nowKey]: { amount: fe.amount, paid: false } } }];
      });
    }
    setVariableExpenses(ve);
    setVariableIncome(data.variableIncome || []);
    setDailyEntries(data.dailyEntries || []);
    setDirty(false);
  }

  React.useEffect(() => {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        loadFromData(JSON.parse(raw));
        setShowWelcome(false);
      } else {
        const old = localStorage.getItem("finanzas-app-data-v1");
        if (old) {
          loadFromData(JSON.parse(old));
          setShowWelcome(false);
        }
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  React.useEffect(() => {
    if (!loaded || showWelcome) return;
    try {
      const data = { variableExpenses, variableIncome, dailyEntries };
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
      setAutoSaved(true);
    } catch (e) {}
  }, [variableExpenses, variableIncome, dailyEntries, loaded, showWelcome]);

  function handleWelcomeFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        loadFromData(data);
        setShowWelcome(false);
      } catch (err) {
        setWelcomeMsg("No se pudo leer ese archivo. Fijate que sea el .json que descargaste antes.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const mKey = monthKey(selectedDate);

  function addDailyEntry(entry) {
    setDailyEntries([...dailyEntries, { id: newId(), ...entry }]);
    setDirty(true);
  }
  function deleteDailyEntry(id) {
    setDailyEntries(dailyEntries.filter((e) => e.id !== id));
    setDirty(true);
  }

  function variableList(kind) {
    return kind === "expense" ? variableExpenses : variableIncome;
  }
  function setVariableList(kind, list) {
    if (kind === "expense") setVariableExpenses(list);
    else setVariableIncome(list);
  }
  function addVariableItem(kind, item) {
    setVariableList(kind, [...variableList(kind), { id: newId(), ...item, installments: {} }]);
    setDirty(true);
  }
  function deleteVariableItem(kind, id) {
    setVariableList(kind, variableList(kind).filter((i) => i.id !== id));
    setDirty(true);
  }
  function addVariableInstallments(kind, itemId, entries) {
    setVariableList(
      kind,
      variableList(kind).map((it) => {
        if (it.id !== itemId) return it;
        const updated = { ...it.installments };
        entries.forEach(({ month, amount }) => {
          updated[month] = { amount, paid: updated[month]?.paid || false };
        });
        return { ...it, installments: updated };
      })
    );
    setDirty(true);
  }
  function deleteVariableInstallment(kind, itemId, month) {
    setVariableList(
      kind,
      variableList(kind).map((it) => {
        if (it.id !== itemId) return it;
        const updated = { ...it.installments };
        delete updated[month];
        return { ...it, installments: updated };
      })
    );
    setDirty(true);
  }
  function toggleVariableInstallment(kind, itemId, month) {
    setVariableList(
      kind,
      variableList(kind).map((it) => {
        if (it.id !== itemId) return it;
        const cur = it.installments[month];
        if (!cur) return it;
        return { ...it, installments: { ...it.installments, [month]: { ...cur, paid: !cur.paid } } };
      })
    );
    setDirty(true);
  }

  const monthDaily = dailyEntries.filter((e) => e.date.slice(0, 7) === mKey);
  const dailyExpenses = monthDaily.filter((e) => e.type === "expense");
  const dailyIncome = monthDaily.filter((e) => e.type === "income");
  const dailyExpTotal = dailyExpenses.reduce((s, i) => s + Number(i.amount), 0);
  const dailyIncTotal = dailyIncome.reduce((s, i) => s + Number(i.amount), 0);

  const varExpRows = variableExpenses.map((it) => ({ id: it.id, name: it.name, category: it.category, inst: it.installments[mKey] })).filter((r) => r.inst);
  const varExpTotal = varExpRows.reduce((s, r) => s + Number(r.inst.amount), 0);
  const varExpPaidTotal = varExpRows.filter((r) => r.inst.paid).reduce((s, r) => s + Number(r.inst.amount), 0);

  const varIncRows = variableIncome.map((it) => ({ id: it.id, name: it.name, inst: it.installments[mKey] })).filter((r) => r.inst);
  const varIncTotal = varIncRows.reduce((s, r) => s + Number(r.inst.amount), 0);
  const varIncPaidTotal = varIncRows.filter((r) => r.inst.paid).reduce((s, r) => s + Number(r.inst.amount), 0);

  const gastoTotal = varExpTotal + dailyExpTotal;
  const gastoPagadoTotal = varExpPaidTotal + dailyExpTotal;
  const ingresoTotal = varIncTotal + dailyIncTotal;
  const ingresoCobradoTotal = varIncPaidTotal + dailyIncTotal;

  const balanceActual = ingresoCobradoTotal - gastoPagadoTotal;
  const balanceProyectado = ingresoTotal - gastoTotal;

  const realNowKey = monthKey(new Date());
  const overdueItems = [];
  variableExpenses.forEach((it) => {
    Object.keys(it.installments).forEach((m) => {
      const inst = it.installments[m];
      if (!inst.paid && m < realNowKey) overdueItems.push({ name: it.name, month: m, amount: inst.amount });
    });
  });

  function changeMonth(delta) {
    const d = new Date(selectedDate);
    d.setMonth(d.getMonth() + delta);
    setSelectedDate(d);
  }

  if (showWelcome) {
    return (
      <div style={{ ...wrap, minHeight: 420, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <FontImport />
        <div className="fx-catbg" />
        <div style={{ position: "relative", maxWidth: 360, textAlign: "center" }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 24, fontWeight: 600, color: "var(--ink)", marginBottom: 8 }}>
            ¡Hola! 🐾
          </div>
          <p style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink-soft)", lineHeight: 1.5, marginBottom: 20 }}>
            Este navegador guarda tus datos solo. Si venís de otro dispositivo y tenés una copia guardada, subila acá. Si es tu primera vez, arrancá de cero.
          </p>
          <label style={{ ...addBtn, display: "inline-block", cursor: "pointer", marginBottom: 12 }}>
            Cargar mi copia guardada
            <input type="file" accept="application/json" onChange={handleWelcomeFile} style={{ display: "none" }} />
          </label>
          <div>
            <button className="fx-btn" onClick={() => setShowWelcome(false)} style={{ ...backupBtn, marginTop: 4 }}>
              Empezar de cero
            </button>
          </div>
          {welcomeMsg && <p style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--red)", marginTop: 14 }}>{welcomeMsg}</p>}
        </div>
      </div>
    );
  }

  return (
    <div style={wrap}>
      <FontImport />
      <div className="fx-catbg" />
      <datalist id="fx-categorias">
        {CATEGORIAS.map((c) => <option key={c} value={c} />)}
      </datalist>
      <style>{`
        * { box-sizing: border-box; }
        .fx-btn { cursor: pointer; border: none; transition: opacity .15s ease, transform .1s ease; }
        .fx-btn:hover { opacity: .85; }
        .fx-btn:active { transform: scale(0.97); }
        .fx-tab { cursor: pointer; }
        .fx-row:hover .fx-del { opacity: 1; }
        .fx-del { opacity: 0; transition: opacity .15s ease; }
        input, select { font-family: 'Inter', sans-serif; }

        @media (max-width: 520px) {
          .fx-hero { padding: 14px 16px 12px !important; }
          .fx-tabs { padding: 0 16px !important; }
          .fx-body { padding: 16px !important; }
          .fx-balance { font-size: 26px !important; }
          .fx-title { font-size: 20px !important; }
          .fx-resumen-grid { grid-template-columns: 1fr !important; }
          .fx-form-row { flex-direction: column !important; align-items: stretch !important; }
          .fx-form-row input, .fx-form-row select { width: 100% !important; }
          .fx-stats { gap: 10px 20px !important; margin-top: 10px !important; display: grid !important; grid-template-columns: 1fr 1fr !important; }
          .fx-cat { width: 40px !important; height: 40px !important; top: 10px !important; right: 14px !important; }
          .fx-del { opacity: 1; }
          .fx-balance-block { margin-top: 8px !important; }
          .fx-stamp { padding: 3px 9px !important; font-size: 10px !important; }
          .fx-proyectado { display: none !important; }
        }
      `}</style>

      <CatBackground />

      {/* Header / hero (acá vive el resumen) */}
      <div className="fx-hero" style={hero}>
        <CatSilhouette className="fx-cat" size={50} color="var(--accent)" style={{ position: "absolute", top: 16, right: 20 }} />
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-soft)", marginBottom: 4 }}>
              Mis finanzas
            </div>
            <div className="fx-title" style={{ fontFamily: "'Fraunces', serif", fontSize: 28, fontWeight: 600, color: "var(--ink)" }}>
              Libro de cuentas
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button className="fx-btn" onClick={() => changeMonth(-1)} style={navBtn}>‹</button>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--ink)", minWidth: 130, textAlign: "center" }}>
              {monthLabel(selectedDate)}
            </div>
            <button className="fx-btn" onClick={() => changeMonth(1)} style={navBtn}>›</button>
          </div>
        </div>

        <div className="fx-balance-block" style={{ display: "flex", alignItems: "center", gap: 20, marginTop: 16, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)" }}>Saldo real del mes</div>
            <div className="fx-balance" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 34, fontWeight: 700, color: balanceActual >= 0 ? "var(--green)" : "var(--red)" }}>
              {fmtGs(balanceActual)}
            </div>
            <div className="fx-proyectado" style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>
              Proyectado: {fmtGs(balanceProyectado)}
            </div>
          </div>
          <div className="fx-stamp" style={stamp(balanceActual >= 0)}>
            {balanceActual >= 0 ? "AL DÍA" : "EN ROJO"}
          </div>
        </div>

        <div className="fx-stats" style={{ display: "flex", gap: 24, marginTop: 14, flexWrap: "wrap" }}>
          <MiniStat label="Ingresos cobrados" value={`${fmtGs(ingresoCobradoTotal)} / ${fmtGs(ingresoTotal)}`} color="var(--green)" />
          <MiniStat label="Gastos pagados" value={`${fmtGs(gastoPagadoTotal)} / ${fmtGs(gastoTotal)}`} color="var(--red)" />
        </div>
      </div>

      {autoSaved && (
        <div style={autoSavedBanner}>✓ Guardado automáticamente en este navegador</div>
      )}

      {overdueItems.length > 0 && (
        <div style={overdueBanner}>
          ⚠ Tenés {overdueItems.length} cuota{overdueItems.length > 1 ? "s" : ""} vencida{overdueItems.length > 1 ? "s" : ""} sin pagar — revisá "Gastos fijos"
        </div>
      )}

      <BackupBar
        variableExpenses={variableExpenses}
        variableIncome={variableIncome}
        dailyEntries={dailyEntries}
        dirty={dirty}
        onSaved={() => setDirty(false)}
        onRestore={(data) => loadFromData(data)}
      />

      {/* Tabs */}
      <div className="fx-tabs" style={tabsBar}>
        {[
          ["diario", "Diario"],
          ["gastos-fijos", "Gastos fijos"],
          ["ingresos-fijos", "Ingresos fijos"],
        ].map(([key, label]) => (
          <div
            key={key}
            className="fx-tab"
            onClick={() => setTab(key)}
            style={{
              ...tabItem,
              color: tab === key ? "var(--ink)" : "var(--ink-soft)",
              borderBottom: tab === key ? "2px solid var(--accent)" : "2px solid transparent",
              fontWeight: tab === key ? 600 : 500,
            }}
          >
            {label}
          </div>
        ))}
      </div>

      <div className="fx-body" style={{ padding: "20px 24px 32px", position: "relative" }}>
        {tab === "diario" && (
          <Diario entries={monthDaily} onAdd={addDailyEntry} onDelete={deleteDailyEntry} />
        )}
        {tab === "gastos-fijos" && (
          <Variables
            kind="expense"
            items={variableExpenses}
            mKey={mKey}
            realNowKey={realNowKey}
            monthLabel={monthLabel(selectedDate)}
            onAddItem={addVariableItem}
            onDeleteItem={deleteVariableItem}
            onAddInstallments={addVariableInstallments}
            onDeleteInstallment={deleteVariableInstallment}
            onToggleInstallment={toggleVariableInstallment}
          />
        )}
        {tab === "ingresos-fijos" && (
          <Variables
            kind="income"
            items={variableIncome}
            mKey={mKey}
            realNowKey={realNowKey}
            monthLabel={monthLabel(selectedDate)}
            onAddItem={addVariableItem}
            onDeleteItem={deleteVariableItem}
            onAddInstallments={addVariableInstallments}
            onDeleteInstallment={deleteVariableInstallment}
            onToggleInstallment={toggleVariableInstallment}
          />
        )}
      </div>
    </div>
  );
}

function MiniStat({ label, value, color }) {
  return (
    <div>
      <div style={{ fontFamily: "Inter, sans-serif", fontSize: 11, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, fontWeight: 600, color }}>{value}</div>
    </div>
  );
}

function categoryBadge() {
  return {
    fontFamily: "Inter, sans-serif",
    fontSize: 10,
    fontWeight: 600,
    padding: "2px 8px",
    borderRadius: 999,
    background: "rgba(232,115,74,0.14)",
    color: "var(--accent)",
  };
}

function Variables({ kind, items, mKey, realNowKey, monthLabel, onAddItem, onDeleteItem, onAddInstallments, onDeleteInstallment, onToggleInstallment }) {
  const [form, setForm] = useState({ name: "", category: "" });
  const [expandedId, setExpandedId] = useState(null);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={card}>
        <SectionTitle>{kind === "expense" ? "Nuevo gasto fijo" : "Nuevo ingreso fijo"}</SectionTitle>
        <p style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: "var(--ink-soft)", marginTop: -4, marginBottom: 12 }}>
          {kind === "expense"
            ? "Para lo que pagás todos los meses con un monto que ya conocés (alquiler, préstamos, cuotas)."
            : "Para tu sueldo u otro ingreso fijo mensual."}
        </p>
        <div className="fx-form-row" style={formRow}>
          <input
            placeholder={kind === "expense" ? "Nombre (ej. Alquiler)" : "Nombre (ej. Sueldo)"}
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            style={{ ...input, flex: 2 }}
          />
          {kind === "expense" && (
            <input list="fx-categorias" placeholder="Categoría (opcional)" value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} style={{ ...input, flex: 1 }} />
          )}
          <button
            className="fx-btn"
            type="button"
            onClick={() => {
              if (!form.name) return;
              onAddItem(kind, { name: form.name, category: kind === "expense" ? form.category : undefined });
              setForm({ name: "", category: "" });
            }}
            style={addBtn}
          >
            Crear
          </button>
        </div>
      </div>

      {items.length === 0 && <Empty>Todavía no cargaste {kind === "expense" ? "ningún gasto fijo" : "ningún ingreso fijo"}.</Empty>}

      {items.map((it) => {
        const thisMonth = it.installments[mKey];
        const thisMonthOverdue = kind === "expense" && thisMonth && !thisMonth.paid && mKey < realNowKey;
        const expanded = expandedId === it.id;
        const monthsSorted = Object.keys(it.installments).sort();
        return (
          <div key={it.id} style={card}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 600, color: "var(--ink)" }}>{it.name}</span>
                {it.category && <span style={categoryBadge()}>{it.category}</span>}
              </div>
              <button className="fx-btn" onClick={() => onDeleteItem(kind, it.id)} style={delBtn}>✕ eliminar</button>
            </div>

            {thisMonth ? (
              <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", padding: "8px 0", borderBottom: "1px solid #EEF1EE" }}>
                <input type="checkbox" checked={thisMonth.paid} onChange={() => onToggleInstallment(kind, it.id, mKey)} style={checkbox} />
                <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink)", textDecoration: thisMonth.paid ? "line-through" : "none", opacity: thisMonth.paid ? 0.55 : 1, flex: 1 }}>
                  {kind === "expense" ? "Cuota" : "Cobro"} de {monthLabel}
                </span>
                {thisMonthOverdue && <span style={overdueBadge}>VENCIDO</span>}
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--ink)" }}>{fmtGs(thisMonth.amount)}</span>
              </label>
            ) : (
              <Empty>No hay monto cargado para {monthLabel}.</Empty>
            )}

            <div
              className="fx-tab"
              onClick={() => setExpandedId(expanded ? null : it.id)}
              style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--accent)", fontWeight: 600, marginTop: 10, cursor: "pointer" }}
            >
              {expanded ? "Ocultar historial completo ▲" : `Ver / cargar historial completo (${monthsSorted.length} meses cargados) ▼`}
            </div>

            {expanded && (
              <div style={{ marginTop: 12 }}>
                {monthsSorted.length > 0 && (
                  <div style={{ marginBottom: 12 }}>
                    {monthsSorted.map((m) => {
                      const inst = it.installments[m];
                      const overdue = kind === "expense" && !inst.paid && m < realNowKey;
                      return (
                        <div key={m} className="fx-row" style={listRow}>
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "var(--ink)" }}>{m}</span>
                          <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            {overdue && <span style={overdueBadge}>VENCIDO</span>}
                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: inst.paid ? "var(--green)" : "var(--ink-soft)" }}>
                              {fmtGs(inst.amount)} {inst.paid ? "· ✓" : ""}
                            </span>
                          </span>
                          <button className="fx-btn fx-del" onClick={() => onDeleteInstallment(kind, it.id, m)} style={delBtn}>✕</button>
                        </div>
                      );
                    })}
                  </div>
                )}
                <VariableScheduleForm itemId={it.id} kind={kind} onAddInstallments={onAddInstallments} />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function VariableScheduleForm({ itemId, kind, onAddInstallments }) {
  const [single, setSingle] = useState({ month: todayISO().slice(0, 7), amount: "" });
  const [bulkText, setBulkText] = useState("");
  const [bulkMsg, setBulkMsg] = useState("");

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div>
        <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)", marginBottom: 6 }}>Agregar un mes</div>
        <div className="fx-form-row" style={formRow}>
          <input type="month" value={single.month} onChange={(e) => setSingle({ ...single, month: e.target.value })} style={{ ...input, flex: 1 }} />
          <input placeholder="Monto de ese mes" type="number" value={single.amount} onChange={(e) => setSingle({ ...single, amount: e.target.value })} style={{ ...input, flex: 1 }} />
          <button
            className="fx-btn"
            type="button"
            onClick={() => {
              if (!single.month || !single.amount) return;
              onAddInstallments(kind, itemId, [{ month: single.month, amount: Number(single.amount) }]);
              setSingle({ ...single, amount: "" });
            }}
            style={addBtn}
          >
            Agregar
          </button>
        </div>
      </div>

      <div>
        <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)", marginBottom: 6 }}>
          O pegá varios de una vez (una por línea: <code>2026-07:350000</code>)
        </div>
        <textarea
          value={bulkText}
          onChange={(e) => setBulkText(e.target.value)}
          placeholder={"2026-07:350000\n2026-08:342000\n2026-09:334000"}
          rows={4}
          style={{ ...input, width: "100%", fontFamily: "'IBM Plex Mono', monospace", resize: "vertical" }}
        />
        <button
          className="fx-btn"
          type="button"
          onClick={() => {
            const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
            const entries = [];
            for (const line of lines) {
              const [month, amountStr] = line.split(":").map((s) => s && s.trim());
              const amount = Number(amountStr);
              if (/^\d{4}-\d{2}$/.test(month) && !isNaN(amount) && amount > 0) {
                entries.push({ month, amount });
              }
            }
            if (entries.length === 0) {
              setBulkMsg("No se reconoció ninguna línea. Usá el formato AAAA-MM:monto");
            } else {
              onAddInstallments(kind, itemId, entries);
              setBulkText("");
              setBulkMsg(`${entries.length} mes(es) cargado(s) ✓`);
            }
            setTimeout(() => setBulkMsg(""), 3000);
          }}
          style={{ ...addBtn, marginTop: 8 }}
        >
          Cargar todas
        </button>
        {bulkMsg && <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--green)", marginTop: 6 }}>{bulkMsg}</div>}
      </div>
    </div>
  );
}

function Diario({ entries, onAdd, onDelete }) {
  const [form, setForm] = useState({ type: "expense", date: todayISO(), desc: "", amount: "", category: "" });
  const sorted = [...entries].sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={card}>
        <SectionTitle>Registrar movimiento diario</SectionTitle>
        <div style={{ display: "grid", gap: 10 }}>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={() => setForm({ ...form, type: "expense" })} style={toggleBtn(form.type === "expense", "var(--red)")}>Gasto</button>
            <button type="button" onClick={() => setForm({ ...form, type: "income" })} style={toggleBtn(form.type === "income", "var(--green)")}>Ingreso</button>
          </div>
          <div className="fx-form-row" style={formRow}>
            <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={{ ...input, flex: 1 }} />
            <input placeholder="Descripción" value={form.desc} onChange={(e) => setForm({ ...form, desc: e.target.value })} style={{ ...input, flex: 2 }} />
            <input placeholder="Monto" type="number" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} style={{ ...input, flex: 1 }} />
            {form.type === "expense" && (
              <input list="fx-categorias" placeholder="Categoría (opcional)" value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} style={{ ...input, flex: 1 }} />
            )}
            <button
              className="fx-btn"
              type="button"
              onClick={() => {
                if (!form.desc || !form.amount) return;
                const entry = { type: form.type, date: form.date, desc: form.desc, amount: Number(form.amount) };
                if (form.type === "expense") entry.category = form.category;
                onAdd(entry);
                setForm({ ...form, desc: "", amount: "", category: "" });
              }}
              style={addBtn}
            >
              Agregar
            </button>
          </div>
        </div>
      </div>

      <div style={card}>
        <SectionTitle>Movimientos del mes</SectionTitle>
        {sorted.length === 0 && <Empty>Todavía no registraste movimientos este mes.</Empty>}
        {sorted.map((e) => (
          <div key={e.id} className="fx-row" style={listRow}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, flexWrap: "wrap" }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "var(--ink-soft)", minWidth: 70 }}>{e.date.slice(8, 10)}/{e.date.slice(5, 7)}</span>
              <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink)" }}>{e.desc}</span>
              {e.type === "expense" && e.category && <span style={categoryBadge()}>{e.category}</span>}
            </div>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: e.type === "expense" ? "var(--red)" : "var(--green)", marginRight: 12 }}>
              {e.type === "expense" ? "-" : "+"}{fmtGs(e.amount)}
            </span>
            <button className="fx-btn fx-del" onClick={() => onDelete(e.id)} style={delBtn}>✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function BackupBar({ variableExpenses, variableIncome, dailyEntries, dirty, onSaved, onRestore }) {
  const [msg, setMsg] = useState("");

  function exportBackup() {
    const data = { variableExpenses, variableIncome, dailyEntries, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `finanzas-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    onSaved();
    setMsg("Guardado ✓ — buscá el archivo en tu carpeta de Descargas");
    setTimeout(() => setMsg(""), 3500);
  }

  function exportExcel() {
    const wb = XLSX.utils.book_new();

    const varExpRows = [];
    variableExpenses.forEach((it) => {
      Object.keys(it.installments).sort().forEach((m) => {
        const inst = it.installments[m];
        varExpRows.push({ Nombre: it.name, Categoría: it.category || "", Mes: m, Monto: inst.amount, Pagado: inst.paid ? "Sí" : "No" });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(varExpRows), "Gastos fijos");

    const varIncRows = [];
    variableIncome.forEach((it) => {
      Object.keys(it.installments).sort().forEach((m) => {
        const inst = it.installments[m];
        varIncRows.push({ Nombre: it.name, Mes: m, Monto: inst.amount, Cobrado: inst.paid ? "Sí" : "No" });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(varIncRows), "Ingresos fijos");

    const wsDaily = XLSX.utils.json_to_sheet(
      [...dailyEntries].sort((a, b) => (a.date < b.date ? -1 : 1)).map((e) => ({
        Fecha: e.date,
        Tipo: e.type === "expense" ? "Gasto" : "Ingreso",
        Descripción: e.desc,
        Categoría: e.category || "",
        Monto: e.amount,
      }))
    );
    XLSX.utils.book_append_sheet(wb, wsDaily, "Diario");

    const months = new Set();
    dailyEntries.forEach((e) => months.add(e.date.slice(0, 7)));
    variableExpenses.forEach((it) => Object.keys(it.installments).forEach((m) => months.add(m)));
    variableIncome.forEach((it) => Object.keys(it.installments).forEach((m) => months.add(m)));

    const resumenRows = [...months].sort().map((m) => {
      const varExp = variableExpenses.map((it) => it.installments[m]).filter(Boolean);
      const varInc = variableIncome.map((it) => it.installments[m]).filter(Boolean);
      const varExpTotal = varExp.reduce((s, i) => s + Number(i.amount), 0);
      const varExpPaid = varExp.filter((i) => i.paid).reduce((s, i) => s + Number(i.amount), 0);
      const varIncTotal = varInc.reduce((s, i) => s + Number(i.amount), 0);
      const varIncPaid = varInc.filter((i) => i.paid).reduce((s, i) => s + Number(i.amount), 0);
      const monthDaily = dailyEntries.filter((e) => e.date.slice(0, 7) === m);
      const dailyExp = monthDaily.filter((e) => e.type === "expense").reduce((s, e) => s + Number(e.amount), 0);
      const dailyInc = monthDaily.filter((e) => e.type === "income").reduce((s, e) => s + Number(e.amount), 0);
      return {
        Mes: m,
        "Ingresos cobrados": varIncPaid + dailyInc,
        "Ingresos proyectados": varIncTotal + dailyInc,
        "Gastos pagados": varExpPaid + dailyExp,
        "Gastos proyectados": varExpTotal + dailyExp,
        "Saldo real": varIncPaid + dailyInc - (varExpPaid + dailyExp),
        "Saldo proyectado": varIncTotal + dailyInc - (varExpTotal + dailyExp),
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumenRows), "Resumen por mes");

    XLSX.writeFile(wb, `finanzas-${todayISO()}.xlsx`);
    setMsg("Excel descargado ✓ — buscalo en tu carpeta de Descargas");
    setTimeout(() => setMsg(""), 3500);
  }

  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        onRestore(data);
        setMsg("Datos cargados ✓");
      } catch (err) {
        setMsg("No se pudo leer ese archivo.");
      }
      setTimeout(() => setMsg(""), 3500);
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  return (
    <div className="fx-backupbar" style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 24px", background: "var(--card)", borderBottom: "1px solid #DFE6E1", flexWrap: "wrap" }}>
      <span style={{ fontFamily: "Inter, sans-serif", fontSize: 11, color: "var(--ink-soft)" }}>Copia extra (opcional, para otro dispositivo):</span>
      <button className="fx-btn" onClick={exportBackup} style={backupBtn}>Descargar copia</button>
      <label style={{ ...backupBtn, display: "inline-block", cursor: "pointer" }}>
        Cargar copia
        <input type="file" accept="application/json" onChange={importBackup} style={{ display: "none" }} />
      </label>
      <button className="fx-btn" onClick={exportExcel} style={backupBtn}>Exportar a Excel</button>
      {msg && <span style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--green)" }}>{msg}</span>}
    </div>
  );
}

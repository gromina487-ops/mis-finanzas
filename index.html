<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B3A34" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Mis Finanzas</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFF3F0; font-family: sans-serif; }
  #root { min-height: 100vh; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;


const MESES = [
  "Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
];

function monthKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}
function monthLabel(date) {
  return `${MESES[date.getMonth()]} ${date.getFullYear()}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtGs(n) {
  const v = Number(n) || 0;
  return "₲ " + v.toLocaleString("es-PY", { maximumFractionDigits: 0 });
}
function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const LOCAL_KEY = "finanzas-app-data-v1";

function FinanzasTracker() {
  const [config, setConfig] = useState({ fixedExpenses: [], fixedIncome: [] });
  const [dailyEntries, setDailyEntries] = useState([]);
  const [monthlyStatus, setMonthlyStatus] = useState({});
  const [loans, setLoans] = useState([]);
  const [selectedDate, setSelectedDate] = useState(new Date());
  const [tab, setTab] = useState("resumen");
  const [dirty, setDirty] = useState(false);
  const [showWelcome, setShowWelcome] = useState(true);
  const [welcomeMsg, setWelcomeMsg] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [autoSaved, setAutoSaved] = useState(false);

  function loadFromData(data) {
    if (data.config) setConfig(data.config);
    if (data.dailyEntries) setDailyEntries(data.dailyEntries);
    if (data.monthlyStatus) setMonthlyStatus(data.monthlyStatus);
    if (data.loans) setLoans(data.loans);
    setDirty(false);
  }

  // Al abrir la app, fijate si ya hay datos guardados en este navegador
  React.useEffect(() => {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        loadFromData(JSON.parse(raw));
        setShowWelcome(false);
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  // Cada vez que algo cambia, se guarda solo en este navegador (no hace falta descargar archivo)
  React.useEffect(() => {
    if (!loaded || showWelcome) return;
    try {
      const data = { config, dailyEntries, monthlyStatus, loans };
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
      setAutoSaved(true);
    } catch (e) {}
  }, [config, dailyEntries, monthlyStatus, loans, loaded, showWelcome]);

  function handleWelcomeFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        loadFromData(data);
        setShowWelcome(false);
      } catch (err) {
        setWelcomeMsg("No se pudo leer ese archivo. Fijate que sea el .json que descargaste antes.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const mKey = monthKey(selectedDate);
  const status = monthlyStatus[mKey] || { expensesPaid: [], incomePaid: [] };

  function toggleExpensePaid(id) {
    const cur = monthlyStatus[mKey] || { expensesPaid: [], incomePaid: [] };
    const set = new Set(cur.expensesPaid);
    set.has(id) ? set.delete(id) : set.add(id);
    setMonthlyStatus({ ...monthlyStatus, [mKey]: { ...cur, expensesPaid: [...set] } });
    setDirty(true);
  }
  function toggleIncomeReceived(id) {
    const cur = monthlyStatus[mKey] || { expensesPaid: [], incomePaid: [] };
    const set = new Set(cur.incomePaid);
    set.has(id) ? set.delete(id) : set.add(id);
    setMonthlyStatus({ ...monthlyStatus, [mKey]: { ...cur, incomePaid: [...set] } });
    setDirty(true);
  }

  function addFixedExpense(item) {
    setConfig({ ...config, fixedExpenses: [...config.fixedExpenses, { id: newId(), ...item }] });
    setDirty(true);
  }
  function addFixedIncome(item) {
    setConfig({ ...config, fixedIncome: [...config.fixedIncome, { id: newId(), ...item }] });
    setDirty(true);
  }
  function deleteFixedExpense(id) {
    setConfig({ ...config, fixedExpenses: config.fixedExpenses.filter((i) => i.id !== id) });
    setDirty(true);
  }
  function deleteFixedIncome(id) {
    setConfig({ ...config, fixedIncome: config.fixedIncome.filter((i) => i.id !== id) });
    setDirty(true);
  }
  function addDailyEntry(entry) {
    setDailyEntries([...dailyEntries, { id: newId(), ...entry }]);
    setDirty(true);
  }
  function deleteDailyEntry(id) {
    setDailyEntries(dailyEntries.filter((e) => e.id !== id));
    setDirty(true);
  }

  function addLoan(item) {
    setLoans([...loans, { id: newId(), name: item.name, method: item.method, installments: {} }]);
    setDirty(true);
  }
  function deleteLoan(loanId) {
    setLoans(loans.filter((l) => l.id !== loanId));
    setDirty(true);
  }
  function addInstallments(loanId, entries) {
    setLoans(
      loans.map((l) => {
        if (l.id !== loanId) return l;
        const updated = { ...l.installments };
        entries.forEach(({ month, amount }) => {
          updated[month] = { amount, paid: updated[month]?.paid || false };
        });
        return { ...l, installments: updated };
      })
    );
    setDirty(true);
  }
  function deleteInstallment(loanId, month) {
    setLoans(
      loans.map((l) => {
        if (l.id !== loanId) return l;
        const updated = { ...l.installments };
        delete updated[month];
        return { ...l, installments: updated };
      })
    );
    setDirty(true);
  }
  function toggleInstallmentPaid(loanId, month) {
    setLoans(
      loans.map((l) => {
        if (l.id !== loanId) return l;
        const cur = l.installments[month];
        if (!cur) return l;
        return { ...l, installments: { ...l.installments, [month]: { ...cur, paid: !cur.paid } } };
      })
    );
    setDirty(true);
  }

  const monthDaily = dailyEntries.filter((e) => e.date.slice(0, 7) === mKey);
  const dailyExpenses = monthDaily.filter((e) => e.type === "expense");
  const dailyIncome = monthDaily.filter((e) => e.type === "income");

  const loanRowsThisMonth = loans
    .map((l) => ({ loanId: l.id, name: l.name, method: l.method, inst: l.installments[mKey] }))
    .filter((r) => r.inst);
  const loanExpTotal = loanRowsThisMonth.reduce((s, r) => s + Number(r.inst.amount), 0);
  const loanExpPaidTotal = loanRowsThisMonth.filter((r) => r.inst.paid).reduce((s, r) => s + Number(r.inst.amount), 0);

  const fixedExpTotal = config.fixedExpenses.reduce((s, i) => s + Number(i.amount), 0) + loanExpTotal;
  const fixedExpPaidTotal =
    config.fixedExpenses.filter((i) => status.expensesPaid.includes(i.id)).reduce((s, i) => s + Number(i.amount), 0) +
    loanExpPaidTotal;
  const fixedIncTotal = config.fixedIncome.reduce((s, i) => s + Number(i.amount), 0);
  const fixedIncRecTotal = config.fixedIncome
    .filter((i) => status.incomePaid.includes(i.id))
    .reduce((s, i) => s + Number(i.amount), 0);
  const dailyExpTotal = dailyExpenses.reduce((s, i) => s + Number(i.amount), 0);
  const dailyIncTotal = dailyIncome.reduce((s, i) => s + Number(i.amount), 0);

  const balanceActual = fixedIncRecTotal + dailyIncTotal - (fixedExpPaidTotal + dailyExpTotal);
  const balanceProyectado = fixedIncTotal + dailyIncTotal - (fixedExpTotal + dailyExpTotal);

  const tarjetaTotal =
    config.fixedExpenses
      .filter((i) => status.expensesPaid.includes(i.id) && i.method === "tarjeta")
      .reduce((s, i) => s + Number(i.amount), 0) +
    dailyExpenses.filter((e) => e.method === "tarjeta").reduce((s, i) => s + Number(i.amount), 0) +
    loanRowsThisMonth.filter((r) => r.inst.paid && r.method === "tarjeta").reduce((s, r) => s + Number(r.inst.amount), 0);
  const cuentaTotal =
    config.fixedExpenses
      .filter((i) => status.expensesPaid.includes(i.id) && i.method === "cuenta")
      .reduce((s, i) => s + Number(i.amount), 0) +
    dailyExpenses.filter((e) => e.method === "cuenta").reduce((s, i) => s + Number(i.amount), 0) +
    loanRowsThisMonth.filter((r) => r.inst.paid && r.method === "cuenta").reduce((s, r) => s + Number(r.inst.amount), 0);

  function changeMonth(delta) {
    const d = new Date(selectedDate);
    d.setMonth(d.getMonth() + delta);
    setSelectedDate(d);
  }

  if (showWelcome) {
    return (
      <div style={{ ...wrap, minHeight: 420, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <FontImport />
        <div className="fx-catbg" />
        <div style={{ position: "relative", maxWidth: 360, textAlign: "center" }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 24, fontWeight: 600, color: "var(--ink)", marginBottom: 8 }}>
            ¡Hola! 🐾
          </div>
          <p style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink-soft)", lineHeight: 1.5, marginBottom: 20 }}>
            A partir de ahora, este navegador guarda tus datos solo — no hace falta cargar ningún archivo cada vez. Si venís de otro dispositivo y tenés una copia guardada, subila acá. Si es tu primera vez, arrancá de cero.
          </p>
          <label style={{ ...addBtn, display: "inline-block", cursor: "pointer", marginBottom: 12 }}>
            Cargar mi copia guardada
            <input type="file" accept="application/json" onChange={handleWelcomeFile} style={{ display: "none" }} />
          </label>
          <div>
            <button className="fx-btn" onClick={() => setShowWelcome(false)} style={{ ...backupBtn, marginTop: 4 }}>
              Empezar de cero
            </button>
          </div>
          {welcomeMsg && <p style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--red)", marginTop: 14 }}>{welcomeMsg}</p>}
        </div>
      </div>
    );
  }

  return (
    <div style={wrap}>
      <FontImport />
      <div className="fx-catbg" />
      <style>{`
        * { box-sizing: border-box; }
        .fx-btn { cursor: pointer; border: none; transition: opacity .15s ease; }
        .fx-btn:hover { opacity: .85; }
        .fx-tab { cursor: pointer; }
        .fx-row:hover .fx-del { opacity: 1; }
        .fx-del { opacity: 0; transition: opacity .15s ease; }
        input, select { font-family: 'Inter', sans-serif; }

        @media (max-width: 520px) {
          .fx-hero { padding: 14px 16px 12px !important; }
          .fx-tabs { padding: 0 16px !important; }
          .fx-body { padding: 16px !important; }
          .fx-balance { font-size: 22px !important; }
          .fx-title { font-size: 19px !important; }
          .fx-resumen-grid { grid-template-columns: 1fr !important; }
          .fx-form-row { flex-direction: column !important; align-items: stretch !important; }
          .fx-form-row input, .fx-form-row select { width: 100% !important; }
          .fx-stats { gap: 10px 20px !important; margin-top: 10px !important; display: grid !important; grid-template-columns: 1fr 1fr !important; }
          .fx-cat { width: 34px !important; height: 34px !important; top: 8px !important; right: 12px !important; }
          .fx-del { opacity: 1; }
          .fx-balance-block { margin-top: 10px !important; }
          .fx-stamp { padding: 3px 9px !important; font-size: 10px !important; }
          .fx-proyectado { display: none !important; }
        }
      `}</style>

      <CatBackground />

      {/* Header / hero */}
      <div className="fx-hero" style={hero}>
        <CatPeek />
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-soft)", marginBottom: 4 }}>
              Mis finanzas
            </div>
            <div className="fx-title" style={{ fontFamily: "'Fraunces', serif", fontSize: 28, fontWeight: 600, color: "var(--ink)" }}>
              Libro de cuentas
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button className="fx-btn" onClick={() => changeMonth(-1)} style={navBtn}>‹</button>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--ink)", minWidth: 130, textAlign: "center" }}>
              {monthLabel(selectedDate)}
            </div>
            <button className="fx-btn" onClick={() => changeMonth(1)} style={navBtn}>›</button>
          </div>
        </div>

        <div className="fx-balance-block" style={{ display: "flex", alignItems: "center", gap: 20, marginTop: 22, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)" }}>Saldo real del mes</div>
            <div className="fx-balance" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 34, fontWeight: 600, color: balanceActual >= 0 ? "var(--green)" : "var(--red)" }}>
              {fmtGs(balanceActual)}
            </div>
            <div className="fx-proyectado" style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>
              Proyectado si cobrás/pagás todo: {fmtGs(balanceProyectado)}
            </div>
          </div>
          <div className="fx-stamp" style={stamp(balanceActual >= 0)}>
            {balanceActual >= 0 ? "AL DÍA" : "EN ROJO"}
          </div>
        </div>

        <div className="fx-stats" style={{ display: "flex", gap: 24, marginTop: 18, flexWrap: "wrap" }}>
          <MiniStat label="Tarjeta de crédito" value={fmtGs(tarjetaTotal)} color="var(--indigo)" />
          <MiniStat label="Cuenta / efectivo" value={fmtGs(cuentaTotal)} color="var(--gold)" />
          <MiniStat label="Ingresos fijos cobrados" value={`${fmtGs(fixedIncRecTotal)} / ${fmtGs(fixedIncTotal)}`} color="var(--green)" />
          <MiniStat label="Gastos fijos pagados" value={`${fmtGs(fixedExpPaidTotal)} / ${fmtGs(fixedExpTotal)}`} color="var(--red)" />
        </div>
      </div>

      {autoSaved && (
        <div style={autoSavedBanner}>
          ✓ Guardado automáticamente en este navegador
        </div>
      )}

      <BackupBar
        config={config}
        dailyEntries={dailyEntries}
        monthlyStatus={monthlyStatus}
        loans={loans}
        dirty={dirty}
        onSaved={() => setDirty(false)}
        onRestore={(data) => loadFromData(data)}
      />

      {/* Tabs */}
      <div className="fx-tabs" style={tabsBar}>
        {[
          ["resumen", "Resumen"],
          ["fijos", "Fijos del mes"],
          ["prestamos", "Montos variables"],
          ["diario", "Diario"],
        ].map(([key, label]) => (
          <div
            key={key}
            className="fx-tab"
            onClick={() => setTab(key)}
            style={{
              ...tabItem,
              color: tab === key ? "var(--ink)" : "var(--ink-soft)",
              borderBottom: tab === key ? "2px solid var(--ink)" : "2px solid transparent",
              fontWeight: tab === key ? 600 : 500,
            }}
          >
            {label}
          </div>
        ))}
      </div>

      <div className="fx-body" style={{ padding: "20px 24px 32px", position: "relative" }}>
        {tab === "resumen" && (
          <Resumen
            fixedExpenses={config.fixedExpenses}
            fixedIncome={config.fixedIncome}
            status={status}
            dailyExpenses={dailyExpenses}
            dailyIncome={dailyIncome}
            loanRowsThisMonth={loanRowsThisMonth}
            onToggleLoan={toggleInstallmentPaid}
            mKey={mKey}
          />
        )}
        {tab === "fijos" && (
          <Fijos
            fixedExpenses={config.fixedExpenses}
            fixedIncome={config.fixedIncome}
            status={status}
            onAddExpense={addFixedExpense}
            onAddIncome={addFixedIncome}
            onDeleteExpense={deleteFixedExpense}
            onDeleteIncome={deleteFixedIncome}
            onToggleExpense={toggleExpensePaid}
            onToggleIncome={toggleIncomeReceived}
          />
        )}
        {tab === "prestamos" && (
          <Prestamos
            loans={loans}
            mKey={mKey}
            monthLabel={monthLabel(selectedDate)}
            onAddLoan={addLoan}
            onDeleteLoan={deleteLoan}
            onAddInstallments={addInstallments}
            onDeleteInstallment={deleteInstallment}
            onToggleInstallment={toggleInstallmentPaid}
          />
        )}
        {tab === "diario" && (
          <Diario
            entries={monthDaily}
            onAdd={addDailyEntry}
            onDelete={deleteDailyEntry}
          />
        )}
      </div>
    </div>
  );
}

function MiniStat({ label, value, color }) {
  return (
    <div>
      <div style={{ fontFamily: "Inter, sans-serif", fontSize: 11, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, fontWeight: 600, color }}>{value}</div>
    </div>
  );
}

function Resumen({ fixedExpenses, fixedIncome, status, dailyExpenses, dailyIncome, loanRowsThisMonth, onToggleLoan, mKey }) {
  const pendingExp = fixedExpenses.filter((i) => !status.expensesPaid.includes(i.id));
  const pendingInc = fixedIncome.filter((i) => !status.incomePaid.includes(i.id));
  const pendingLoans = (loanRowsThisMonth || []).filter((r) => !r.inst.paid);
  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={card}>
        <SectionTitle>Pendiente de pagar este mes</SectionTitle>
        {pendingExp.length === 0 && pendingLoans.length === 0 ? (
          <Empty>No tenés gastos fijos pendientes. ✓</Empty>
        ) : (
          <>
            {pendingExp.map((i) => (
              <div key={i.id} style={listRow}>
                <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink)" }}>{i.name}</span>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--red)" }}>{fmtGs(i.amount)}</span>
              </div>
            ))}
            {pendingLoans.map((r) => (
              <div key={r.loanId} style={listRow}>
                <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                  <input type="checkbox" checked={false} onChange={() => onToggleLoan(r.loanId, mKey)} style={checkbox} />
                  <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink)" }}>{r.name} (cuota)</span>
                </label>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--red)" }}>{fmtGs(r.inst.amount)}</span>
              </div>
            ))}
          </>
        )}
      </div>
      <div style={card}>
        <SectionTitle>Pendiente de cobrar este mes</SectionTitle>
        {pendingInc.length === 0 ? (
          <Empty>Ya cobraste todos tus ingresos fijos. ✓</Empty>
        ) : (
          pendingInc.map((i) => (
            <div key={i.id} style={listRow}>
              <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink)" }}>{i.name}</span>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--green)" }}>{fmtGs(i.amount)}</span>
            </div>
          ))
        )}
      </div>
      <div className="fx-resumen-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
        <div style={card}>
          <SectionTitle>Gastos diarios del mes</SectionTitle>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 22, color: "var(--red)", fontWeight: 600 }}>
            {fmtGs(dailyExpenses.reduce((s, i) => s + Number(i.amount), 0))}
          </div>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)" }}>{dailyExpenses.length} registros</div>
        </div>
        <div style={card}>
          <SectionTitle>Ingresos diarios / extra</SectionTitle>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 22, color: "var(--green)", fontWeight: 600 }}>
            {fmtGs(dailyIncome.reduce((s, i) => s + Number(i.amount), 0))}
          </div>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)" }}>{dailyIncome.length} registros</div>
        </div>
      </div>
    </div>
  );
}

function Fijos({ fixedExpenses, fixedIncome, status, onAddExpense, onAddIncome, onDeleteExpense, onDeleteIncome, onToggleExpense, onToggleIncome }) {
  const [expForm, setExpForm] = useState({ name: "", amount: "", method: "cuenta" });
  const [incForm, setIncForm] = useState({ name: "", amount: "" });

  return (
    <div style={{ display: "grid", gap: 28 }}>
      <div style={card}>
        <SectionTitle>Gastos fijos mensuales</SectionTitle>
        {fixedExpenses.length === 0 && <Empty>Todavía no agregaste ningún gasto fijo.</Empty>}
        {fixedExpenses.map((i) => {
          const paid = status.expensesPaid.includes(i.id);
          return (
            <div key={i.id} className="fx-row" style={listRow}>
              <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flex: 1 }}>
                <input type="checkbox" checked={paid} onChange={() => onToggleExpense(i.id)} style={checkbox} />
                <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink)", textDecoration: paid ? "line-through" : "none", opacity: paid ? 0.55 : 1 }}>
                  {i.name}
                </span>
                <span style={methodBadge(i.method)}>{i.method === "tarjeta" ? "Tarjeta" : "Cuenta/Efectivo"}</span>
              </label>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--ink)", marginRight: 12 }}>{fmtGs(i.amount)}</span>
              <button className="fx-btn fx-del" onClick={() => onDeleteExpense(i.id)} style={delBtn}>✕</button>
            </div>
          );
        })}
        <div className="fx-form-row" style={formRow}>
          <input placeholder="Nombre (ej. Alquiler)" value={expForm.name} onChange={(e) => setExpForm({ ...expForm, name: e.target.value })} style={{ ...input, flex: 2 }} />

function Prestamos({ loans, mKey, monthLabel, onAddLoan, onDeleteLoan, onAddInstallments, onDeleteInstallment, onToggleInstallment }) {
  const [loanForm, setLoanForm] = useState({ name: "", method: "cuenta" });
  const [expandedId, setExpandedId] = useState(null);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={card}>
        <SectionTitle>Nuevo gasto de monto variable</SectionTitle>
        <p style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: "var(--ink-soft)", marginTop: -4, marginBottom: 12 }}>
          Para tarjeta de crédito, préstamos, o cualquier gasto fijo que cambie de monto cada mes. Cargalo acá y después su cronograma (el monto de cada mes).
        </p>
        <div className="fx-form-row" style={formRow}>
          <input placeholder="Nombre (ej. Tarjeta Visa Continental)" value={loanForm.name} onChange={(e) => setLoanForm({ ...loanForm, name: e.target.value })} style={{ ...input, flex: 2 }} />
          <select value={loanForm.method} onChange={(e) => setLoanForm({ ...loanForm, method: e.target.value })} style={{ ...input, flex: 1 }}>
            <option value="cuenta">Cuenta/Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
          </select>
          <button
            className="fx-btn"
            type="button"
            onClick={() => {
              if (!loanForm.name) return;
              onAddLoan(loanForm);
              setLoanForm({ name: "", method: "cuenta" });
            }}
            style={addBtn}
          >
            Crear
          </button>
        </div>
      </div>

      {loans.length === 0 && <Empty>Todavía no cargaste ningún gasto de monto variable.</Empty>}

      {loans.map((loan) => {
        const thisMonth = loan.installments[mKey];
        const expanded = expandedId === loan.id;
        const monthsSorted = Object.keys(loan.installments).sort();
        return (
          <div key={loan.id} style={card}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "'Fraunces', serif", fontSize: 16, fontWeight: 600, color: "var(--ink)" }}>{loan.name}</span>
                <span style={methodBadge(loan.method)}>{loan.method === "tarjeta" ? "Tarjeta" : "Cuenta/Efectivo"}</span>
              </div>
              <button className="fx-btn" onClick={() => onDeleteLoan(loan.id)} style={delBtn}>✕ eliminar</button>
            </div>

            {thisMonth ? (
              <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", padding: "8px 0", borderBottom: "1px solid #EEF1EE" }}>
                <input type="checkbox" checked={thisMonth.paid} onChange={() => onToggleInstallment(loan.id, mKey)} style={checkbox} />
                <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: "var(--ink)", textDecoration: thisMonth.paid ? "line-through" : "none", opacity: thisMonth.paid ? 0.55 : 1, flex: 1 }}>
                  Cuota de {monthLabel}
                </span>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--ink)" }}>{fmtGs(thisMonth.amount)}</span>
              </label>
            ) : (
              <Empty>No hay cuota cargada para {monthLabel}.</Empty>
            )}

            <div
              className="fx-tab"
              onClick={() => setExpandedId(expanded ? null : loan.id)}
              style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--indigo)", fontWeight: 600, marginTop: 10, cursor: "pointer" }}
            >
              {expanded ? "Ocultar cronograma completo ▲" : `Ver / cargar cronograma completo (${monthsSorted.length} cuotas cargadas) ▼`}
            </div>

            {expanded && (
              <div style={{ marginTop: 12 }}>
                {monthsSorted.length > 0 && (
                  <div style={{ marginBottom: 12 }}>
                    {monthsSorted.map((m) => (
                      <div key={m} className="fx-row" style={listRow}>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "var(--ink)" }}>{m}</span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: loan.installments[m].paid ? "var(--green)" : "var(--ink-soft)" }}>
                          {fmtGs(loan.installments[m].amount)} {loan.installments[m].paid ? "· pagada" : ""}
                        </span>
                        <button className="fx-btn fx-del" onClick={() => onDeleteInstallment(loan.id, m)} style={delBtn}>✕</button>
                      </div>
                    ))}

              </div>
            )}

        );
      })}
    </div>
  );
}

function LoanScheduleForm({ loanId, onAddInstallments }) {
  const [single, setSingle] = useState({ month: todayISO().slice(0, 7), amount: "" });
  const [bulkText, setBulkText] = useState("");
  const [bulkMsg, setBulkMsg] = useState("");

  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div>
        <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)", marginBottom: 6 }}>Agregar una cuota</div>
        <div className="fx-form-row" style={formRow}>
          <input type="month" value={single.month} onChange={(e) => setSingle({ ...single, month: e.target.value })} style={{ ...input, flex: 1 }} />
          <input placeholder="Monto de esa cuota" type="number" value={single.amount} onChange={(e) => setSingle({ ...single, amount: e.target.value })} style={{ ...input, flex: 1 }} />
          <button
            className="fx-btn"
            type="button"
            onClick={() => {
              if (!single.month || !single.amount) return;
              onAddInstallments(loanId, [{ month: single.month, amount: Number(single.amount) }]);
              setSingle({ ...single, amount: "" });
            }}
            style={addBtn}
          >
            Agregar
          </button>
        </div>
      </div>

      <div>
        <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--ink-soft)", marginBottom: 6 }}>
          O pegá varias de una vez (una por línea: <code>2026-07:350000</code>)
        </div>
        <textarea
          value={bulkText}
          onChange={(e) => setBulkText(e.target.value)}
          placeholder={"2026-07:350000\n2026-08:342000\n2026-09:334000"}
          rows={4}
          style={{ ...input, width: "100%", fontFamily: "'IBM Plex Mono', monospace", resize: "vertical" }}
        />
        <button
          className="fx-btn"
          type="button"
          onClick={() => {
            const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
            const entries = [];
            for (const line of lines) {
              const [month, amountStr] = line.split(":").map((s) => s && s.trim());
              const amount = Number(amountStr);
              if (/^\d{4}-\d{2}$/.test(month) && !isNaN(amount) && amount > 0) {
                entries.push({ month, amount });
              }
            }
            if (entries.length === 0) {
              setBulkMsg("No se reconoció ninguna línea. Usá el formato AAAA-MM:monto");
            } else {
              onAddInstallments(loanId, entries);
              setBulkText("");
              setBulkMsg(`${entries.length} cuota(s) cargada(s) ✓`);
            }
            setTimeout(() => setBulkMsg(""), 3000);
          }}
          style={{ ...addBtn, marginTop: 8 }}
        >
          Cargar todas
        </button>
        {bulkMsg && <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--green)", marginTop: 6 }}>{bulkMsg}</div>}
      </div>
    </div>
  );
}

function BackupBar({ config, dailyEntries, monthlyStatus, loans, dirty, onSaved, onRestore }) {
  const [msg, setMsg] = useState("");

  function exportBackup() {
    const data = { config, dailyEntries, monthlyStatus, loans, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `finanzas-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    onSaved();
    setMsg("Guardado ✓ — buscá el archivo en tu carpeta de Descargas");
    setTimeout(() => setMsg(""), 3500);
  }

  function exportExcel() {
    const wb = XLSX.utils.book_new();

    const wsExpenses = XLSX.utils.json_to_sheet(
      config.fixedExpenses.map((i) => ({ Nombre: i.name, Monto: i.amount, "Método de pago": i.method === "tarjeta" ? "Tarjeta" : "Cuenta/Efectivo" }))
    );
    XLSX.utils.book_append_sheet(wb, wsExpenses, "Gastos fijos");

    const wsIncome = XLSX.utils.json_to_sheet(config.fixedIncome.map((i) => ({ Nombre: i.name, Monto: i.amount })));
    XLSX.utils.book_append_sheet(wb, wsIncome, "Ingresos fijos");

    const loanRows = [];
    loans.forEach((l) => {
      Object.keys(l.installments)
        .sort()
        .forEach((m) => {
          const inst = l.installments[m];
          loanRows.push({
            Concepto: l.name,
            Mes: m,
            Monto: inst.amount,
            "Método de pago": l.method === "tarjeta" ? "Tarjeta" : "Cuenta/Efectivo",
            Pagada: inst.paid ? "Sí" : "No",
          });
        });
    });
    const wsLoans = XLSX.utils.json_to_sheet(loanRows);
    XLSX.utils.book_append_sheet(wb, wsLoans, "Montos variables");

    const wsDaily = XLSX.utils.json_to_sheet(
      [...dailyEntries]
        .sort((a, b) => (a.date < b.date ? -1 : 1))
        .map((e) => ({
          Fecha: e.date,
          Tipo: e.type === "expense" ? "Gasto" : "Ingreso",
          Descripción: e.desc,
          Monto: e.amount,
          "Método de pago": e.type === "expense" ? (e.method === "tarjeta" ? "Tarjeta" : "Cuenta/Efectivo") : "",
        }))
    );
    XLSX.utils.book_append_sheet(wb, wsDaily, "Diario");

    // Resumen por mes: junta todos los meses que aparecen en algún lado
    const months = new Set();
    Object.keys(monthlyStatus).forEach((m) => months.add(m));
    dailyEntries.forEach((e) => months.add(e.date.slice(0, 7)));
    loans.forEach((l) => Object.keys(l.installments).forEach((m) => months.add(m)));

    const resumenRows = [...months].sort().map((m) => {
      const st = monthlyStatus[m] || { expensesPaid: [], incomePaid: [] };
      const loanInst = loans.map((l) => l.installments[m]).filter(Boolean);
      const fixedExpTotal = config.fixedExpenses.reduce((s, i) => s + Number(i.amount), 0) + loanInst.reduce((s, i) => s + Number(i.amount), 0);
      const fixedExpPaid =
        config.fixedExpenses.filter((i) => st.expensesPaid.includes(i.id)).reduce((s, i) => s + Number(i.amount), 0) +
        loanInst.filter((i) => i.paid).reduce((s, i) => s + Number(i.amount), 0);
      const fixedIncTotal = config.fixedIncome.reduce((s, i) => s + Number(i.amount), 0);
      const fixedIncPaid = config.fixedIncome.filter((i) => st.incomePaid.includes(i.id)).reduce((s, i) => s + Number(i.amount), 0);
      const monthDaily = dailyEntries.filter((e) => e.date.slice(0, 7) === m);
      const dailyExp = monthDaily.filter((e) => e.type === "expense").reduce((s, e) => s + Number(e.amount), 0);
      const dailyInc = monthDaily.filter((e) => e.type === "income").reduce((s, e) => s + Number(e.amount), 0);
      return {
        Mes: m,
        "Ingresos cobrados": fixedIncPaid + dailyInc,
        "Ingresos proyectados": fixedIncTotal + dailyInc,
        "Gastos pagados": fixedExpPaid + dailyExp,
        "Gastos proyectados": fixedExpTotal + dailyExp,
        "Saldo real": fixedIncPaid + dailyInc - (fixedExpPaid + dailyExp),
        "Saldo proyectado": fixedIncTotal + dailyInc - (fixedExpTotal + dailyExp),
      };
    });
    const wsResumen = XLSX.utils.json_to_sheet(resumenRows);
    XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen por mes");

    XLSX.writeFile(wb, `finanzas-${todayISO()}.xlsx`);
    setMsg("Excel descargado ✓ — buscalo en tu carpeta de Descargas");
    setTimeout(() => setMsg(""), 3500);
  }

  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        onRestore(data);
        setMsg("Datos cargados ✓");
      } catch (err) {
        setMsg("No se pudo leer ese archivo.");
      }
      setTimeout(() => setMsg(""), 3500);
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  return (
    <div className="fx-backupbar" style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 24px", background: "var(--card)", borderBottom: "1px solid #DFE6E1", flexWrap: "wrap" }}>
      <span style={{ fontFamily: "Inter, sans-serif", fontSize: 11, color: "var(--ink-soft)" }}>Copia extra (opcional, para otro dispositivo):</span>
      <button className="fx-btn" onClick={exportBackup} style={backupBtn}>
        Descargar copia
      </button>
      <label style={{ ...backupBtn, display: "inline-block", cursor: "pointer" }}>
        Cargar copia
        <input type="file" accept="application/json" onChange={importBackup} style={{ display: "none" }} />
      </label>
      <button className="fx-btn" onClick={exportExcel} style={backupBtn}>
        Exportar a Excel
      </button>
      {msg && <span style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: "var(--green)" }}>{msg}</span>}
    </div>
  );
}
